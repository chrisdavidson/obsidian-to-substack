[project]
name = "obsidian-to-substack"
version = "1.2.0"
description = "Convert Obsidian Markdown articles to Substack-compatible HTML output"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "cairosvg>=2.7",
    "Pillow>=11.0",
    "Markdown>=3.7",
    "beautifulsoup4>=4.13",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
obsidian-to-substack = "obsidian_to_substack.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_to_substack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
